.c2{animation:c2 9s ease infinite;opacity:0}
@keyframes c2{0%,14%{opacity:0}18%,30%{opacity:1}34%,100%{opacity:0}}
.c3{animation:c3 9s cubic-bezier(.2,.8,.2,1) infinite;opacity:0;transform-box:fill-box;transform-origin:0 100%}
@keyframes c3{0%,32%{opacity:0;transform:scale(.7) translateY(10px)}38%,88%{opacity:1;transform:none}95%,100%{opacity:0}}
.dt{animation:dt .9s ease-in-out infinite}
@keyframes dt{0%,100%{opacity:.3}50%{opacity:1}}
.kn{animation:kn 5s cubic-bezier(.4,0,.2,1) infinite}
