<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 176" width="290" height="176" role="img" aria-label="Telegram Join the channel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:fl 7.5s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-7px)}}
.pu{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.rip{animation:rip 2.8s cubic-bezier(.2,.6,.3,1) infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes rip{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
.gy{animation:gy 4.4s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes gy{0%{transform:scaleY(.2)}40%,70%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
.gx{animation:gx 5s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes gx{0%,6%{transform:scaleX(0)}28%,80%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
.bk{animation:bk 1.1s steps(1) infinite}
