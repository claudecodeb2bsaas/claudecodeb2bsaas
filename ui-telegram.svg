.gon{animation:gon 5s cubic-bezier(.4,0,.2,1) infinite;opacity:0}
@keyframes gon{0%,30%{opacity:0}38%,80%{opacity:1}90%,100%{opacity:0}}
.cu{animation:cu 5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes cu{0%{transform:translate(110px,150px)}26%{transform:translate(34px,112px)}31%{transform:translate(34px,112px) scale(.82)}36%{transform:translate(34px,112px) scale(1)}74%{transform:translate(34px,112px)}92%,100%{transform:translate(110px,150px)}}
.ck{stroke-dasharray:22;stroke-dashoffset:22;animation:ck 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ck{0%,8%{stroke-dashoffset:22}18%,84%{stroke-dashoffset:0}94%,100%{stroke-dashoffset:22}}
.cm{animation:cm 7s linear infinite}
@keyframes cm{to{stroke-dashoffset:-870}}
.tw{animation:tw 4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes tw{0%{transform:scaleX(0)}}
</style>
